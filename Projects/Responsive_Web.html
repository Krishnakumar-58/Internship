<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body
        {
            font-family: 'Segoe UI';
            margin: 0;
            padding: 0;
            background: bisque;
        }
        .navbar
        {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgb(10, 10, 227);
            border-bottom: 1px solid black;
            /* box-shadow: 5px 0px 10px black; */
            /* width: 100%; */
        }
        .navbar .logo
        {
            font-weight: bold;
            color: whitesmoke;
            font-size: 24px;
        }
        .navbar .links
        {
            display: none;
            list-style: none;
            gap: 24px;
            margin: 0;
            padding: 0; 
            color: whitesmoke;  
        }
       .navbar .btn
        {
            display: block;
            background: none;
            border: 1px solid black;
            color: olivedrab;
            cursor: crosshair;
            border-radius: 6px;
        }
        .container
        {
            display: grid;
            grid-template-columns: 1fr;
            /* gap: 10px; */
        }
        .box1
        {
            background: whitesmoke;
            border:1px solid black;
            overflow: hidden;
        }
        .container .box1 img
        {
            height: 100%;
            width: 100%;
            transition: 0.3s ease all;
        }
        .container .box1 img:hover{
            scale: 1.1;
        }
        @media (min-width:700px)
        {
            .navbar .links{display: flex;}
            .navbar .btn{display: none;}
        }
        @media (min-width:500px)
        {
            .container{grid-template-columns:repeat(1,1fr);}
        }
        @media (min-width:700px)
        {
            .container{grid-template-columns:repeat(2,1fr);}
        }
        @media (min-width:1000px)
        {
            .container{grid-template-columns:repeat(2,1fr);}
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">K</div>
        <ul class="links">
            <li>Home</li>
            <li>Contact</li>
            <li>About</li>
            <li>Login</li>
        </ul>
        <button class="btn">Menu</button>
    </nav>
    <div class="container">
        <div class="box1">Lorem ipsum dolor sit amet consectetur adipisicing elit. Praesentium, quis ratione impedit iure quibusdam dicta maiores blanditiis, alias quos, suscipit mollitia? Beatae, expedita labore vero rerum voluptates magnam minima dolorem.</div>
        <div class="box1"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_pfCFWP0VNfDu87UnxLp1BQwkRxQBkJVT1gkryBoyVw&s=10" alt=""></div>
    </div>
</body>
</html>
