<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card
        {
            height: 350px;
            width: 300px;
            border: 3px dashed red;
            background: rgb(8, 8, 175);
            color: white;
            text-align: center;
            border-radius: 60px 1px 70px 1px;
            transition: 1s ease all;
            margin: 20px;
            float: left;
        }
        .card img
        {
            height: 200px;
            width: 300px;
            background: white;
            
        }
        .card:hover
        {
            border-radius: 1px 60px 1px 60px;
            background: white;
            color: rgb(8, 8, 175);
            border: 3px dashed blue;
        }
    </style>
</head>
<body>
    <h1 style="align-items: center; text-align: center;">how to use fetch</h1>
    <div id="gallery">
    </div>
    <script>
        async function loadImage() {
            const response=await fetch("https://dummyjson.com/products");
            const datas=await response.json();
            console.log(datas);
            const gallery=document.getElementById("gallery");
            datas.products.forEach(data=>{
                gallery.innerHTML+=`
                <br>
                <div class="card">
                    <img
                    src="${data.thumbnail}"
                    alt="${data.title}"
                    >
                    <h3>${data.title}</h3>
                    <h3>${data.price}</h3>
                    <h3>${data.category}</h3>
                    </div>
                    `;
            })
        }
        loadImage();
    </script>
</body>
</html>
