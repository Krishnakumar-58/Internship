<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        *
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body
        {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4facfe,#00f2fe);
        }
        .calculator
        {
            width: 340px;
            background: #022;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,.4);

        }
        #display
        {
            width: 100%;
            height: 70px;
            border: none;
            outline: none;
            font-size: 30px;
            padding: 10px;
            border-radius: 10px;
            background: white;
            margin-bottom: 20px;
            text-align: right;
        }
        .buttons
        {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 12px;
        }
        button
        {
            height: 60px;
            border: none;
            border-radius: 12px;
            font-size: 22px;
            cursor: pointer;
            color: white;
            background: #444;
        }
        button:hover
        {
            background: #666;
        }
        .operator
        {
            background: #ff9800;
        }
        .operator:hover
        {
            background: #e69800;
        }
        .equal
        {
            background: #28a745;
            grid-column: span 2;
        }
        .clear
        {
            background: #dc3545;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button class="clear" onclick="cleardisplay()">C</button>
            <button onclick="deletelast()">X</button>
            <button class="operator" onclick="btnprss('%')">%</button>
            <button class="operator" onclick="btnprss('%')">/</button>
            <button onclick="btnprss('7')">7</button>
            <button onclick="btnprss('8')">8</button>
            <button onclick="btnprss('9')">9</button>
            <button class="operator" onclick="btnprss('*')">*</button>
            <button onclick="btnprss('6')">6</button>
            <button onclick="btnprss('5')">5</button>
            <button onclick="btnprss('4')">4</button>
            <button class="operator" onclick="btnprss('-')">-</button>
            <button onclick="btnprss('3')">3</button>
            <button onclick="btnprss('2')">2</button>
            <button onclick="btnprss('1')">1</button>
            <button class="operator" onclick="btnprss('+')">+</button>
            <button onclick="btnprss('0')">0</button>
            <button onclick="btnprss('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
            </div>
    </div>
    <script>
        let display=document.getElementById("display");
        function btnprss(value)
        {
            display.value+=value;
        }
        function calculate()
        {
            display.value=eval(display.value);
        }
        function cleardisplay()
        {
            display.value="";
        }
        function deletelast()
        {
            display.value=display.value.slice(0,-1)
        }
    </script>
</body>
</html>
